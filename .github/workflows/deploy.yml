name: Deploy to GitHub Pages

on:
  push:
    branches:
      - cartes-advogados
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install

      - name: Build do Projeto (Vite Production)
        run: npm run build
        env:
          NODE_ENV: production
          VITE_CHATWOOT_BASE_URL: https://chat.online.des.br
          VITE_CHATWOOT_TOKEN: KKoEhfthVd1GPBK9wz5VtXtW

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload de Artefato para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
